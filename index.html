<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020617"><title>PM 1 Lerntrainer</title><style>*{box-sizing:border-box}body{margin:0;background:#020617;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:max(12px,env(safe-area-inset-top)) 10px calc(84px + env(safe-area-inset-bottom));min-height:100vh}.box{border:1px solid #1e293b;border-radius:22px;background:#0f172a;padding:18px;margin-bottom:12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.tabs button,.nav button{border:0;border-radius:12px;min-height:50px;background:#1e293b;color:white;font-weight:700}.tabs .on{background:#22d3ee;color:#042f3e}.card{min-height:55vh;display:flex;justify-content:center;flex-direction:column}.card h2{font-size:clamp(26px,8vw,40px)}.muted{color:#94a3b8}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#020617ee;padding:8px 8px max(8px,env(safe-area-inset-bottom))}.nav .primary{background:#22d3ee;color:#042f3e}</style></head><body><main><section class="box"><small style="color:#22d3ee;font-weight:800">HRL PRÜFUNGSTRAINER</small><h1>PM 1 Lerntrainer</h1><p class="muted">Mobile iPhone-Version</p></section><nav class="box tabs"><button class="on">Karten</button><button>Quiz</button><button>Risiken</button><button>Üben</button></nav><section id="card" class="box card" onclick="flip()"><p class="muted" id="label">FRAGE</p><h2 id="text">Was kennzeichnet ein Projekt?</h2><p class="muted">Tippen zum Umdrehen</p></section></main><nav class="nav"><button onclick="prev()">←</button><button class="primary" onclick="flip()">↻</button><button onclick="random()">⤨</button><button onclick="next()">→</button></nav><script>const cards=[['Was kennzeichnet ein Projekt?','Ein Projekt ist zeitlich begrenzt, einmalig, neuartig, bedeutend, ressourcenbegrenzt und komplex.'],['Risiko versus Problem?','Ein Risiko ist ein mögliches zukünftiges Ereignis; ein Problem ist bereits eingetreten.'],['Welche Grössen umfasst das magische Dreieck?','Leistung, Zeit und Budget.'],['Warum Scope abgrenzen?','Eine klare Abgrenzung verhindert Scope Creep und fokussiert auf die Zielerreichung.']];let i=0,f=false;function draw(){label.textContent=f?'ANTWORT':'FRAGE';text.textContent=cards[i][f?1:0]}function flip(){f=!f;draw()}function next(){i=Math.min(cards.length-1,i+1);f=false;draw()}function prev(){i=Math.max(0,i-1);f=false;draw()}function random(){i=Math.floor(Math.random()*cards.length);f=false;draw()}draw();</script></body></html>
