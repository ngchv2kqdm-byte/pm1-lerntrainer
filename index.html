const cards=[{"id": "PM1-001A", "chapter": 1, "module": "Grundlagen", "type": "Definition", "q": "Was bedeutet Projekt?", "a": "Ein zeitlich begrenztes, einmaliges, neuartiges und komplexes Vorhaben mit klaren Zielen sowie begrenzten Ressourcen."}, {"id": "PM1-001B", "chapter": 1, "module": "Grundlagen", "type": "Verständnis", "q": "Warum ist Projekt im Projektmanagement wichtig?", "a": "Projekt ist wichtig, weil damit ein zeitlich begrenztes, einmaliges, neuartiges und komplexes Vorhaben mit klaren Zielen sowie begrenzten Ressourcen. Dadurch werden Entscheidungen, Zusammenarbeit und Zielerreichung unterstützt."}, {"id": "PM1-002A", "chapter": 1, "module": "Grundlagen", "type": "Definition", "q": "Was bedeutet Projektmanagement?", "a": "Die Gesamtheit der Führungsaufgaben, Organisation, Techniken und Mittel zur erfolgreichen Abwicklung eines Projekts."}, {"id": "PM1-002B", "chapter": 1, "module": "Grundlagen", "type": "Verständnis", "q": "Warum ist Projektmanagement im Projektmanagement wichtig?", "a": "Projektmanagement ist wichtig, weil damit die Gesamtheit der Führungsaufgaben, Organisation, Techniken und Mittel zur erfolgreichen Abwicklung eines Projekts. Dadurch werden Entscheidungen, Zusammenarbeit und Zielerreichung unterstützt."}, {"id": "PM1-003A", "chapter": 1, "module": "Grundlagen", "type": "Definition", "q": "Was bedeutet Projektmerkmal?", "a": "Typische Merkmale sind Zielorientierung, Einmaligkeit, zeitliche Begrenzung, Komplexität, Interdisziplinarität und begrenzte Ressourcen."}, {"id": "PM1-003B", "chapter": 1, "module": "Grundlagen", "type": "Verständnis", "q": "Warum ist Projektmerkmal im Projektmanagement wichtig?", "a": "Projektmerkmal ist wichtig, weil damit typische Merkmale sind Zielorientierung, Einmaligkeit, zeitliche Begrenzung, Komplexität, Interdisziplinarität und begrenzte Ressourcen. Dadurch werden Entscheidungen, Zusammenarbeit und Zielerreichung unterstützt."}, {"id": "PM1-004A", "chapter": 1, "module": "Grundlagen", "type": "Definition", "q": "Was bedeutet Tagesgeschäft?", "a": "Wiederkehrende, standardisierte Aufgaben der Linienorganisation mit etablierten Abläufen."}, {"id": "PM1-004B", "chapter": 1, "module": "Grundlagen", "type": "Verständnis", "q": "Warum ist Tagesgeschäft im Projektmanagement wichtig?", "a": "Tagesgeschäft ist wichtig, weil damit wiederkehrende, standardisierte Aufgaben der Linienorganisation mit etablierten Abläufen. Dadurch werden Entscheidungen, Zusammenarbeit und Zielerreichung unterstützt."}, {"id": "PM1-005A", "chapter": 1, "module": "Grundlagen", "type": "Definition", "q": "Was bedeutet Projektart?", "a": "Projekte können beispielsweise Investitions-, Organisations-, Entwicklungs-, Informatik- oder Kundenprojekte sein."}, {"id": "PM1-005B", "chapter": 1, "module": "Grundlagen", "type": "Verständnis", "q": "Warum ist Projektart im Projektmanagement wichtig?", "a": "Projektart ist wichtig, weil damit projekte können beispielsweise Investitions-, Organisations-, Entwicklungs-, Informatik- oder Kundenprojekte sein. Dadurch werden Entscheidungen, Zusammenarbeit und Zielerreichung unterstützt."}, {"id": "PM1-006A", "chapter": 1, "module": "Grundlagen", "type": "Definition", "q": "Was bedeutet Einzelprojektmanagement?", "a": "Planung, Führung und Steuerung eines einzelnen Projekts."}, {"id": "PM1-006B", "chapter": 1, "module": "Grundlagen", "type": "Verständnis", "q": "Warum ist Einzelprojektmanagement im Projektmanagement wichtig?", "a": "Einzelprojektmanagement ist wichtig, weil damit planung, Führung und Steuerung eines einzelnen Projekts. Dadurch werden Entscheidungen, Zusammenarbeit und Zielerreichung unterstützt."}, {"id": "PM1-007A", "chapter": 1, "module": "Grundlagen", "type": "Definition", "q": "Was bedeutet Multiprojektmanagement?", "a": "Übergreifende Koordination mehrerer Projekte, insbesondere hinsichtlich Prioritäten, Ressourcen und Abhängigkeiten."}, {"id": "PM1-007B", "chapter": 1, "module": "Grundlagen", "type": "Verständnis", "q": "Warum ist Multiproje wie Analyse und Steuerung von Leistungen, Terminen, Kosten und Risiken. Dadurch werden Entscheidungen, Zusammenarbeit und Zielerreichung unterstützt."}, {"id": "PM1-042A", "chapter": 6, "module": "Steuerung und Controlling", "type": "Definition", "q": "Was bedeutet Soll-Ist-Vergleich?", "a": "Gegenüberstellung geplanter und tatsächlicher Werte zur Erkennung von Abweichungen."}, {"id": "PM1-042B", "chapter": 6, "module": "Steuerung und Controlling", "type": "Verständnis", "q": "Warum ist Soll-Ist-Vergleich im Projektmanagement wichtig?", "a": "Soll-Ist-Vergleich ist wichtig, weil damit gegenüberstellung geplanter und tatsächlicher Werte zur Erkennung von Abweichungen. Dadurch werden Entscheidungen, Zusammenarbeit und Zielerreichung unterstützt."}, {"id": "PM1-043A", "chapter": 6, "module": "Steuerung und Controlling", "type": "Definition", "q": "Was bedeutet Abweichungsanalyse?", "a": "Untersuchung von Ursache, Auswirkung und Handlungsbedarf einer Differenz zwischen Soll und Ist."}, {"id": "PM1-043B", "chapter": 6, "module": "Steuerung und Controlling", "type": "Verständnis", "q": "Warum ist Abweichungsanalyse im Projektmanagement wichtig?", "a": "Abweichungsanalyse ist wichtig, weil damit untersuchung von Ursache, Auswirkung und Handlungsbedarf einer Differenz zwischen Soll und Ist. Dadurch werden Entscheidungen, Zusammenarbeit und Zielerreichung unterstützt."}, {"id": "PM1-044A", "chapter": 6, "module": "Steuerung und Controlling", "type": "Definition", "q": "Was bedeutet Steuerungsmassnahme?", "a": "Gezielter Eingriff, um Abweichungen zu korrigieren oder Projektziele weiterhin zu erreichen."}, {"id": "PM1-044B", "chapter": 6, "module": "Steuerung und Controlling", "type": "Verständnis", "q": "Warum ist Steuerungsmassnahme im Projektmanagement wichtig?", "a": "Steuerungsmassnahme ist wichtig, weil damit gezielter Eingriff, um Abweichungen zu korrigieren oder Projektziele weiterhin zu erreichen. Dadurch werden Entscheidungen, Zusammenarbeit und Zielerreichung unters ng", "Der Ist-Aufwand liegt deutlich über dem Plan.", "Ursache und Forecast analysieren, Handlungsoptionen entwickeln und über Anpassung, Gegenmassnahmen oder Eskalation entscheiden."], ["Unklarer Auftrag", "Projektteam und Auftraggeber verstehen die Ziele unterschiedlich.", "Projektauftrag, Ziele, Scope, Nichtziele und Erfolgskriterien gemeinsam klären und verbindlich bestätigen."], ["Qualitätsmangel", "Ein Liefergegenstand erfüllt die Akzeptanzkriterien nicht.", "Abweichung dokumentieren, Ursache untersuchen, Nachbesserung planen und erneute Qualitätskontrolle durchführen."], ["Projektabschluss", "Das Ergebnis ist eingeführt, aber offene Punkte und Erfahrungen sind nicht dokumentiert.", "Restpunkte regeln, Abnahme und Übergabe sichern, Abschlussbericht erstellen, Lessons Learned durchführen und Projektorganisation auflösen."]],visuals=["Magisches Dreieck", "Projektlebenszyklus", "Projektsteuerkreis", "Projektstrukturplan", "Risikomatrix", "Stakeholder-Matrix", "Teamphasen", "Änderungsprozess", "Planungszyklus", "Stacey-Matrix"];let mode='cards',idx=0,flip=false,chosen=null,qopts=[],points=+(localStorage.pm1ext||0);const app=document.getElementById('app'),filters=document.getElementById('filters'),bottom=document.getElementById('bottom'),search=document.getElementById('search'),chapter=document.getElementById('chapter'),type=document.getElementById('type');cc.textContent=cards.length;tc.textContent=terms.length;mc.textContent=new Set(cards.map(x=>x.module)).size;score.textContent=points;const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));[...new Map(cards.map(x=>[x.chapter,x.module])).entries()].forEach(([n,m])=>chapter.insertAdjacentHTML('beforeend',`<option value="${n}">${n}. ${esc(m)}</option>`));

function diagram(i){let sets=[['Leistung','Zeit','Kosten'],['Initialisierung','Planung','Umsetzung','Abschluss'],['Planen','Umsetzen','Messen','Analysieren','Steuern'],['Projekt','Teilaufgaben','Arbeitspakete'],['Wahrscheinlichkeit','Auswirkung','Priorität'],['Einfluss','Interesse','Einbindung'],['Forming','Storming','Norming','Performing'],['Antrag','Analyse','Entscheid','Umsetzung'],['Ziele','Aufgaben','Termine','Ressourcen','Kosten'],['Einfach','Kompliziert','Komplex','Chaotisch']];return `<div class="visual"><div class="nodes">${sets[i].map((x,j)=>`${j?'<b class="arrow">→</b>':''}<span class="node">${x}</span>`).join('')}</div><p class="muted">${['Zielgrössen stehen in gegenseitiger Abhängigkeit.','Phasen schaffen Struktur und Entscheidpunkte.','Steuerung ist ein laufender Regelkreis.','Vollständige Gliederung des Projektumfangs.','Bewertung unterstützt die Priorisierung.','Strategie richtet sich nach Einfluss und Interesse.','Teams entwickeln sich in typischen Phasen.','Änderungen werden kontrolliert entschieden.','Planung verbindet Ziele mit Umsetzung.','Vorgehen hängt von Klarheit und Unsicherheit ab.'][i]}</p></div>`}
function setMode(m){mode=m;idx=0;flip=false;chosen=null;qopts=[];document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));render()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));function action(){if(mode==='cards'){flip=!flip;render()}else randomCard()}function move(n){let a=list();idx=Math.max(0,Math.min(a.length-1,idx+n));flip=false;chosen=null;qopts=[];render()}function randomCard(){let a=list();idx=Math.floor(Math.random()*a.length);flip=false;chosen=null;qopts=[];render()}function choose(o){if(chosen)return;chosen=o;if(o===list()[idx].a){points++;localStorage.pm1ext=points;score.textContent=points}render()}search.oninput=()=>{idx=0;qopts=[];render()};chapter.onchange=type.onchange=()=>{idx=0;qopts=[];render()};render();
